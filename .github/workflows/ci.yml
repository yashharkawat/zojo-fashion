name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'

jobs:
  # ─── Backend checks ───────────────────────────────────────
  api-check:
    name: API — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      # prisma generate also validates the schema — no separate check needed
      - name: Generate Prisma client
        run: npx prisma generate --schema=../../prisma/schema.prisma

      - name: Typecheck
        run: npm run typecheck

  # ─── Frontend checks ──────────────────────────────────────
  web-check:
    name: Web — typecheck + lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

  # ─── Gate for auto-deploys (Render, Vercel) when "wait for checks" is enabled ───
  deploy-gate:
    name: OK to deploy (all checks passed)
    needs: [api-check, web-check]
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Signalled for Render / Vercel
        run: echo "api-check + web-check passed; deploy jobs may run."

  # ─── Deploy API to Render ─────────────────────────────────
  deploy-api:
    name: Deploy API → Render
    needs: [deploy-gate]
    runs-on: ubuntu-latest
    # Only deploy on pushes to main, not on PRs
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook
        run: |
          curl -f -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"
          echo "Deploy triggered successfully."
